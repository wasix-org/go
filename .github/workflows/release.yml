name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: linux-x86_64
            archive_format: tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: linux-aarch64
            archive_format: tar.gz
          - os: macos-14
            goos: darwin
            goarch: amd64
            artifact_name: darwin-x86_64
            archive_format: tar.gz
          - os: macos-14
            goos: darwin
            goarch: arm64
            artifact_name: darwin-aarch64
            archive_format: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: win
            archive_format: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Set up environment
        shell: bash
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: Build Go
        shell: bash
        if: matrix.os != 'windows-latest'
        working-directory: src
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          bash ./make.bash

      - name: Build Go (Windows)
        shell: cmd
        if: matrix.os == 'windows-latest'
        working-directory: src
        run: |
          set GOOS=${{ matrix.goos }}
          set GOARCH=${{ matrix.goarch }}
          call make.bat

      - name: Get version information
        id: version
        shell: bash
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          # Try ./bin/go first, then ./bin/go.exe (for Windows)
          if [ -f ./bin/go ]; then
            GO_CMD=./bin/go
          elif [ -f ./bin/go.exe ]; then
            GO_CMD=./bin/go.exe
          else
            echo "Error: go binary not found"
            exit 1
          fi
          VERSION_INFO=$($GO_CMD env -json GOVERSION GOOS GOARCH)
          GOVERSION=$(echo "$VERSION_INFO" | jq -r '.GOVERSION')
          VERSION=$(echo "$GOVERSION" | sed 's/^go//')
          echo "$VERSION" > version.txt
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create archive (Unix)
        id: archive_unix
        shell: bash
        if: matrix.archive_format != 'zip'
        run: |
          # Small delay to ensure any file operations from previous steps are complete
          sleep 1
          
          VERSION=$(cat version.txt)
          ARTIFACT_NAME="go-${VERSION}-${{ matrix.artifact_name }}"
          ARCHIVE_NAME="${ARTIFACT_NAME}.tar.gz"
          
          # Create tar archive
          # Note: "file changed as we read it" warnings are harmless - tar still creates a valid archive
          tar --exclude='.git' \
              --exclude='.gitignore' \
              --exclude='.github' \
              --exclude='*.tar.gz' \
              --exclude='*.zip' \
              --exclude='version.txt' \
              -czf "${ARCHIVE_NAME}" .
          
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "artifact_name=${{ matrix.artifact_name }}" >> $GITHUB_OUTPUT

      - name: Create archive (Windows)
        id: archive_windows
        shell: pwsh
        if: matrix.archive_format == 'zip'
        run: |
          # Small delay to ensure any file operations from previous steps are complete
          Start-Sleep -Seconds 1
          
          $VERSION = Get-Content version.txt
          $ARTIFACT_NAME = "go-${VERSION}-${{ matrix.artifact_name }}"
          $ARCHIVE_NAME = "${ARTIFACT_NAME}.zip"
          
          # Use .NET ZipFile class for proper zip creation
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          
          $rootPath = (Get-Location).Path
          $zip = [System.IO.Compression.ZipFile]::Open($ARCHIVE_NAME, [System.IO.Compression.ZipArchiveMode]::Create)
          
          try {
            Get-ChildItem -Path . -Recurse -Force | ForEach-Object {
              $relativePath = $_.FullName.Replace($rootPath, '').TrimStart('\', '/')
              
              # Skip exclusions
              if ($relativePath -notlike '.git\*' -and
                  $relativePath -ne '.gitignore' -and
                  $relativePath -notlike '.github\*' -and
                  $relativePath -notlike '*.zip' -and
                  $relativePath -notlike '*.tar.gz' -and
                  $relativePath -ne 'version.txt' -and
                  -not $_.PSIsContainer) {
                $entryName = $relativePath.Replace('\', '/')
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $_.FullName, $entryName) | Out-Null
              }
            }
          } finally {
            $zip.Dispose()
          }
          
          Write-Host "archive_name=${ARCHIVE_NAME}" >> $env:GITHUB_OUTPUT
          Write-Host "artifact_name=${{ matrix.artifact_name }}" >> $env:GITHUB_OUTPUT

      - name: Determine archive path
        id: archive_path
        shell: bash
        run: |
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            echo "archive_name=${{ steps.archive_windows.outputs.archive_name }}" >> $GITHUB_OUTPUT
          else
            echo "archive_name=${{ steps.archive_unix.outputs.archive_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}
          path: ${{ steps.archive_path.outputs.archive_name }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get tag name
        id: tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag: $TAG_NAME"

      - name: Prepare release artifacts
        id: prepare
        run: |
          # Artifacts are already named correctly: go-{version}-{platform}.{ext}
          # Just collect them into a single directory
          mkdir -p release-artifacts
          
          # Find and copy all archive files
          find artifacts -name "go-*.tar.gz" -o -name "go-*.zip" | while read file; do
            cp "$file" release-artifacts/
          done
          
          echo "Artifacts prepared:"
          ls -lh release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            release-artifacts/go-*.tar.gz
            release-artifacts/go-*.zip
          draft: false
          prerelease: false

